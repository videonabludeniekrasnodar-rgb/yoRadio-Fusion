name: Build yoRadio

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clone Original yoRadio (C3 Compatible)
        run: |
          git clone https://github.com original-yoradio

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Inject myoptions.h and Create Configuration
        run: |
          cd original-yoradio
          cp ../yoRadio/src/myoptions.h ./yoRadio/src/myoptions.h
          
          echo "[platformio]" > platformio.ini
          echo "src_dir = yoRadio/src" >> platformio.ini
          echo "data_dir = yoRadio/data" >> platformio.ini
          echo "" >> platformio.ini
          echo "[env:esp32-c3]" >> platformio.ini
          echo "platform = espressif32" >> platformio.ini
          echo "board = esp32-c3-devkitm-1" >> platformio.ini
          echo "framework = arduino" >> platformio.ini
          echo "lib_deps =" >> platformio.ini
          echo "    adafruit/Adafruit GFX Library @ ^1.11.9" >> platformio.ini
          echo "    adafruit/Adafruit BusIO @ ^1.16.1" >> platformio.ini
          echo "    bblanchon/ArduinoJson @ ^6.21.3" >> platformio.ini
          echo "    https://github.com" >> platformio.ini
          echo "    links2004/WebSockets @ ^2.4.1" >> platformio.ini

      - name: Build Firmware
        run: |
          cd original-yoradio
          pio run -e esp32-c3

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yoradio-esp32c3-firmware
          path: original-yoradio/.pio/build/esp32-c3/firmware.bin

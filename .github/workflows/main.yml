name: Build yoRadio

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Patch configuration for ESP32-C3
        run: |
          echo "[platformio]" >> platformio.ini
          echo "src_dir = yoRadio/src" >> platformio.ini
          echo "data_dir = yoRadio/data" >> platformio.ini
          echo "" >> platformio.ini
          echo "[env:esp32-c3]" >> platformio.ini
          echo "platform = espressif32" >> platformio.ini
          echo "board = esp32-c3-devkitm-1" >> platformio.ini
          echo "framework = arduino" >> platformio.ini

      - name: Build Firmware
        run: |
          pio run -e esp32-c3

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yoradio-esp32c3-firmware
          path: .pio/build/esp32-c3/firmware.bin
